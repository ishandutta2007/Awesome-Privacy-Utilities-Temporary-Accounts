<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#080c16" />
    </linearGradient>

    <!-- Glowing Accents -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.9" />
    </linearGradient>

    <radialGradient id="glowGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="purpleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <!-- Filters -->
    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" />
    </filter>

    <filter id="shadowFilter" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    .dynamic-bg-circle1 {
      animation: floatSlow 14s ease-in-out infinite alternate;
    }
    .dynamic-bg-circle2 {
      animation: floatOpposite 16s ease-in-out infinite alternate;
    }
    .data-stream {
      stroke-dasharray: 8, 12;
      animation: flowStream 25s linear infinite;
    }
    .shield-pulse {
      animation: shieldPulseAnim 5s ease-in-out infinite alternate;
      transform-origin: 1040px 180px;
    }
    .orbiting-dot {
      animation: orbitRotate 18s linear infinite;
      transform-origin: 1040px 180px;
    }
    .chip-glow {
      animation: chipPulse 4s ease-in-out infinite alternate;
    }
    @keyframes floatSlow {
      0% { transform: translate(0px, 0px) scale(1); }
      100% { transform: translate(30px, 20px) scale(1.1); }
    }
    @keyframes floatOpposite {
      0% { transform: translate(0px, 0px) scale(1); }
      100% { transform: translate(-35px, -25px) scale(1.15); }
    }
    @keyframes flowStream {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes shieldPulseAnim {
      0% { transform: scale(0.97); opacity: 0.85; }
      100% { transform: scale(1.03); opacity: 1; }
    }
    @keyframes orbitRotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes chipPulse {
      0% { opacity: 0.5; }
      100% { opacity: 0.9; }
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 38px;
      font-weight: 800;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px;
      font-weight: 400;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }
  </style>

  <!-- Canvas Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <!-- Animated Glowing Nebulas in Background (Behind Text) -->
  <g class="dynamic-bg-circle1">
    <circle cx="180" cy="100" r="140" fill="url(#glowGlow)" filter="url(#blurFilter)" />
  </g>
  <g class="dynamic-bg-circle2">
    <circle cx="1020" cy="200" r="180" fill="url(#purpleGlow)" filter="url(#blurFilter)" />
  </g>

  <!-- Technical Grid Pattern Background Accent -->
  <g stroke="#334155" stroke-width="0.5" stroke-opacity="0.25">
    <line x1="80" y1="0" x2="80" y2="360" />
    <line x1="280" y1="0" x2="280" y2="360" />
    <line x1="480" y1="0" x2="480" y2="360" />
    <line x1="680" y1="0" x2="680" y2="360" />
    <line x1="880" y1="0" x2="880" y2="360" />
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="270" x2="1200" y2="270" />
  </g>

  <!-- Flowing Dynamic Data Stream Lines (Far Right / Background) -->
  <g fill="none" stroke="url(#cyanPurple)" stroke-width="1.8" opacity="0.35" class="data-stream">
    <path d="M 850,50 C 950,50 980,140 1060,140 C 1140,140 1170,220 1200,220" />
    <path d="M 870,310 C 940,310 990,240 1060,240 C 1130,240 1150,150 1200,150" />
    <path d="M 820,180 C 920,180 960,110 1040,110 C 1120,110 1150,80 1200,80" />
  </g>

  <!-- Right Decorative Emblem: Dynamic Privacy Cyber-Shield -->
  <g class="orbiting-dot">
    <circle cx="1040" cy="80" r="3" fill="#38bdf8" opacity="0.8" />
    <circle cx="1140" cy="180" r="2.5" fill="#a855f7" opacity="0.8" />
    <circle cx="940" cy="180" r="2" fill="#38bdf8" opacity="0.6" />
    <circle cx="1040" cy="280" r="3.5" fill="#6366f1" opacity="0.7" />
  </g>

  <g class="shield-pulse" filter="url(#shadowFilter)">
    <!-- Outer Shield Frame -->
    <path d="M 1040,105 L 1115,138 C 1115,198 1085,248 1040,265 C 995,248 965,198 965,138 Z"
          fill="none" stroke="url(#shieldGrad)" stroke-width="2.5" opacity="0.75" />
    <!-- Inner Shield Plate -->
    <path d="M 1040,118 L 1102,145 C 1102,194 1076,234 1040,249 C 1004,234 978,194 978,145 Z"
          fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" fill-opacity="0.6" />
    <!-- Cyber Keyhole & Padlock Core -->
    <circle cx="1040" cy="172" r="14" fill="none" stroke="#38bdf8" stroke-width="3" />
    <path d="M 1040,186 L 1040,205" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="1040" cy="172" r="5" fill="#38bdf8" class="chip-glow" />
  </g>

  <!-- Left / Center Foreground Content: Guaranteed Visible and Crisp -->
  <g id="foreground-content" transform="translate(80, 0)">
    <!-- Top Category Tag / Badge -->
    <g transform="translate(0, 52)">
      <rect x="0" y="0" width="220" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="14" cy="14" r="5" fill="#10b981" />
      <text x="28" y="19" class="pill-text" fill="#94a3b8">CURATED PRIVACY SUITE</text>
    </g>

    <!-- Main Title with Gradient Accent -->
    <text x="0" y="132" class="title-text">
      Awesome Privacy Utilities
    </text>
    <text x="0" y="176" class="title-text" fill="url(#cyanPurple)">
      &amp; Temporary Accounts
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="222" class="subtitle-text">
      Disposable Inboxes • Masked Aliasing • Burner Numbers • Anti-Tracking Utilities
    </text>

    <!-- Feature Pills / Badges in Foreground -->
    <g transform="translate(0, 260)">
      <!-- Pill 1: SaaS Comparison -->
      <g transform="translate(0, 0)">
        <rect width="180" height="34" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
        <text x="90" y="22" text-anchor="middle" class="pill-text" fill="#e2e8f0">🛡️ SaaS Market Tiering</text>
      </g>
      <!-- Pill 2: Open Source Stars -->
      <g transform="translate(192, 0)">
        <rect width="186" height="34" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1" stroke-opacity="0.4" />
        <text x="93" y="22" text-anchor="middle" class="pill-text" fill="#e2e8f0">⭐ Ranked GitHub Projects</text>
      </g>
      <!-- Pill 3: Self-Host Ready -->
      <g transform="translate(390, 0)">
        <rect width="168" height="34" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1" stroke-opacity="0.4" />
        <text x="84" y="22" text-anchor="middle" class="pill-text" fill="#e2e8f0">🚀 Self-Hosted &amp; Free</text>
      </g>
    </g>
  </g>

  <!-- Bottom Accent Border -->
  <rect x="0" y="357" width="1200" height="3" fill="url(#cyanPurple)" />
</svg>
